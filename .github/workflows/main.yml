
name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          dart --version
          java -version

      - name: Check project files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Project files ==="
          ls -la
          echo "=== Android manifest ==="
          cat android/app/src/main/AndroidManifest.xml
          echo "=== MainActivity files ==="
          find android/app/src/main -type f \( -name "MainActivity.kt" -o -name "MainActivity.java" \) -print
          echo "=== Android embedding references ==="
          grep -R -n -E 'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|flutterEmbedding' android/app/src || true

      - name: Validate Flutter project
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get -v

      - name: Build APK Release
        run: flutter build apk --release -v

      - name: Verify APK
        if: success()
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
